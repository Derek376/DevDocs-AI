[project]
name = "devdocs-ai-backend"
version = "0.1.0"
description = "REST API for the DevDocs AI documentation assistant"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "pgvector>=0.4,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "pypdf>=6.0,<7.0",
    "python-multipart>=0.0.20,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn>=0.32,<1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13,<3.0",
    "pytest>=8.3,<10.0",
    "ruff>=0.9,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["integration: requires TEST_DATABASE_URL and a live pgvector PostgreSQL server"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
