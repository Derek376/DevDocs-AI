worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # API request logging is performed by FastAPI, without raw URLs or bodies.
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream api {
        zone api 64k;
        server backend:8000 resolve;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        # Includes multipart overhead; backend enforces the configured file limit.
        client_max_body_size 12m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;

        location = /health { default_type application/json; return 200 '{"status":"ok"}'; }
        location = /api { return 308 /api/; }
        location /api/ {
            proxy_pass http://api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            # Backend error responses pass through unchanged.
            proxy_intercept_errors off;
            error_page 502 503 504 = @api_unavailable;
            # Defining location error pages replaces the inherited server set.
            error_page 413 = @upload_too_large;
        }
        location @api_unavailable {
            default_type application/json;
            return 502 '{"detail":"Cannot reach the API. Check the backend and try again."}';
        }
        error_page 413 = @upload_too_large;
        location @upload_too_large {
            default_type application/json;
            return 413 '{"detail":"Upload exceeds the reverse proxy request limit (12 MiB)."}';
        }
        location /assets/ {
            try_files $uri =404;
            expires 1y;
        }
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
        }
    }
}
